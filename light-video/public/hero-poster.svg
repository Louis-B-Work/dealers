<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20262e" />
      <stop offset="0.55" stop-color="#2c333c" />
      <stop offset="1" stop-color="#12161b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0" stop-color="#e85a68" stop-opacity="0.45" />
      <stop offset="1" stop-color="#e85a68" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0f13" />
      <stop offset="1" stop-color="#181c22" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)" />
  <rect width="1920" height="1080" fill="url(#glow)" />
  <rect y="720" width="1920" height="360" fill="url(#floor)" />

  <!-- horizon light streaks -->
  <g opacity="0.5" stroke="#e85a68" stroke-width="2">
    <line x1="0" y1="726" x2="1920" y2="726" opacity="0.35" />
    <line x1="0" y1="742" x2="1920" y2="742" opacity="0.18" />
  </g>

  <!-- abstract car silhouette -->
  <g fill="#0a0d10" opacity="0.92">
    <path d="M560 720c40-90 150-150 400-150s360 60 400 150c60 6 96 20 96 40 0 22-40 30-120 30H584c-80 0-120-8-120-30 0-20 36-34 96-40z" />
    <ellipse cx="760" cy="792" rx="70" ry="70" fill="#05070a" />
    <ellipse cx="1160" cy="792" rx="70" ry="70" fill="#05070a" />
    <ellipse cx="760" cy="792" rx="30" ry="30" fill="#2c333c" />
    <ellipse cx="1160" cy="792" rx="30" ry="30" fill="#2c333c" />
  </g>

  <!-- reflection -->
  <g fill="#e85a68" opacity="0.12">
    <path d="M600 840h720c-40 40-180 70-360 70s-320-30-360-70z" />
  </g>
</svg>
